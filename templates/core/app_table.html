<div class="table-wrap"><table><thead><tr><th>INSTITUTION</th><th>APPLICATION TYPE</th><th>VALIDATION STATUS</th><th></th></tr></thead><tbody>{% for a in apps %}<tr><td><a class="institution" href="{% url 'detail' a.pk %}"><span class="institution-avatar color-{{ forloop.counter0 }}">{{ a.institution|slice:':2'|upper }}</span><span><strong>{{ a.institution }}</strong><small>{{ a.reference }} <span class="table-dot">·</span> {{ a.state }}</small></span></a></td><td><span class="category">{{ a.category }}</span><small class="cell-sub">AY {{ a.year }}</small></td><td><span class="badge {% if a.status == 'Ready for review' %}green{% elif a.status == 'Needs attention' %}orange{% else %}gray{% endif %}"><i></i>{{ a.status }}</span></td><td><a class="row-arrow" aria-label="Open application" href="{% url 'detail' a.pk %}">↗</a></td></tr>{% empty %}<tr><td colspan="4" class="empty">No applications match this view.</td></tr>{% endfor %}</tbody></table></div>
